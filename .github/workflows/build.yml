name: Build and Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every Node.js release currently supported: Current, Active LTS and
        # Maintenance LTS. Update this list as releases enter and leave support.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build

      # Repositories without a "test" script are skipped rather than failed,
      # and start running their tests automatically once one is added.
      - name: Run the tests
        run: npm run test --if-present

      - name: Audit dependencies
        run: npm audit --omit=dev || true
